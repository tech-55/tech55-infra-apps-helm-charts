{{- $envResources := include "app.envValue" (dict "Values" .Values "Key" "resources" "Env" .Values.awsAccountAlias) | fromYaml -}}
{{- $envServiceAccount := include "app.envValue" (dict "Values" .Values "Key" "serviceAccount" "Env" .Values.awsAccountAlias) | fromYaml -}}
{{- $envVars := (index .Values.env .Values.awsAccountAlias | default (index .Values.env "default")) -}}
{{- $envName := include "app.toLower" .Values.environmentName -}}
{{- $appName := include "app.toLower" .Values.appName -}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $appName }}-deployment
  namespace: {{ .Values.namespace }}
spec:
  selector:
    matchLabels:
      app: {{ $appName }}
      environment: {{ $envName }}
  minReadySeconds: 20
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  template:
    metadata:
      labels:
        app: {{ $appName }}
        environment: {{ $envName }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- if $envServiceAccount.roleArn }}
      serviceAccountName: {{$appName}}-sa
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.deployment.gracefulShutdown.terminationGracePeriodSeconds }}
      
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: eks.amazonaws.com/nodegroup
                    operator: In
                    values: ["on-demand-nodes"]

      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: {{ $appName }}
            environment: {{ $envName }}
      
      {{- with .Values.initContainers }}
      initContainers:
        {{- range . }}
        - name: {{ .name }}
          image: {{ .image | default (printf "%s:%s" $.Values.image.repository $.Values.image.tag) }}
          {{- with .command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- if .envFromSecret }}
          envFrom:
            {{- range $.Values.mapSecretToEnv }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}

          {{- with .env }}
          env:
            {{- range $key, $value := . }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}

          {{- with .volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      {{- end }}

      containers:
      - name: {{ $appName }}
        image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag }}
        ports:
          - containerPort: {{.Values.image.port}}
        envFrom:
          - configMapRef:
              name: {{ .Values.mapConfigMapToEnv.generalName }}
          - configMapRef:
              name: {{ .Values.mapConfigMapToEnv.awsAccountName }}
              
          {{- with .Values.mapSecretToEnv }}
          {{- range . }}
          - secretRef:
              name: {{ . }}
          {{- end }}
          {{- end }}
        env:
          - name: ASPNETCORE_ENVIRONMENT
            value: "{{ .Values.environmentName }}"
          - name: APP_ENV
            value: "{{ .Values.environmentName }}"
          - name: NODE_ENV
            value: "{{ .Values.environmentName }}"
          - name: SERVICE_NAME
            value: "{{ .Values.appName }}"
          - name: SERVICE_VERSION
            value: "{{ .Values.image.tag }}"
          - name: SHARED__OtelConfig__ServiceName
            value: "{{ .Values.appName }}"
          - name: SHARED__OtelConfig__ServiceVersion
            value: "{{ .Values.image.tag }}"
          {{- range $env := $envVars}}
          - name: {{ $env.name }}
          {{- if hasKey $env "valueFrom" }}
            valueFrom:
          {{ toYaml $env.valueFrom | indent 12 }}
          {{- else if hasKey $env "value" }}
            value: "{{ $env.value }}"
          {{- end }}
          {{- end }}
        {{- with .Values.liveness }}
        livenessProbe:
{{ toYaml . | indent 12 }}
        {{- end }}
        {{- with .Values.readiness }}
        readinessProbe:
{{ toYaml . | indent 12 }}
        {{- end }}
        {{- with $envResources }}
        resources:
{{ toYaml . | indent 12 }}
        {{- end }}
        {{- with .Values.extraVolumeMounts }}
        volumeMounts:
{{ toYaml . | indent 10 }}
        {{- end }}
        {{- with .Values.extraVolumes }}
      volumes:
{{ toYaml . | indent 8 }}
      {{- end }}